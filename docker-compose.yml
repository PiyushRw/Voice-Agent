services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sales-data:/app/data
  voice:
    profiles: ["voice"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements-live.txt
    env_file: .env
    command: ["python","-m","backend.voice.agent","start"]
    volumes:
      - sales-data:/app/data
      - model-data:/root/.cache/huggingface
volumes:
  sales-data:
  model-data:
